<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamWave - Filmes</title>
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="./index.html" class="logo">
          <span class="logo-icon">⚡</span>
          StreamWave
        </a>

        <ul class="nav-links">
          <li><a href="./index.html">Home</a></li>
          <li><a href="./filmes.html" class="active">Filmes</a></li>
          <li><a href="./series.html">Series</a></li>
          <li><a href="#">Favoritos</a></li>

          <div class="mobile-auth">
            <a class="btn btn-login" href="./login.html">Login</a>
            <a class="btn btn-signup" href="./register.html">Sign Up</a>
          </div>
        </ul>

        <div class="auth-buttons">
          <a class="btn btn-login" href="./login.html">Login</a>
          <a class="btn btn-signup" href="./register.html">Sign Up</a>
        </div>

        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </nav>
    </header>

    <main>
      <div class="page-actions">
        <button class="btn action-btn" id="addMovieBtn" type="button">
          Adicionar filme
        </button>
      </div>
      <div class="container">
        <div id="noContent">
          <h2>Carregando...</h2>
          <p>Buscando filmes disponíveis</p>
        </div>
      </div>
      <div class="modal" id="movieModal" aria-hidden="true">
        <div class="modal__content" role="dialog" aria-modal="true">
          <div class="modal__header">
            <h2 id="movieModalTitle">Adicionar filme</h2>
            <button class="modal__close" type="button" id="movieModalClose">
              ✕
            </button>
          </div>
          <form id="movieForm" class="form">
            <label class="form__field">
              Título
              <input name="titulo" type="text" required />
            </label>
            <label class="form__field">
              Banner (URL)
              <input name="banner" type="url" />
            </label>
            <label class="form__field">
              Poster (URL)
              <input name="poster" type="url" />
            </label>
            <label class="form__field">
              Gêneros (separados por vírgula)
              <input name="genero" type="text" placeholder="Ação, Drama" />
            </label>
            <label class="form__field">
              Duração (minutos)
              <input name="duracao_total" type="number" min="1" required />
            </label>
            <label class="form__field">
              Sinopse
              <textarea name="sinopse" rows="4"></textarea>
            </label>
            <label class="form__field">
              Data de lançamento
              <input name="data_lancamento" type="date" />
            </label>
            <label class="form__field">
              Classificação
              <input name="classificacao" type="text" placeholder="12 anos" />
            </label>
            <label class="form__checkbox">
              <input name="destaque" type="checkbox" />
              Destaque
            </label>
            <input type="hidden" name="tipo" value="FILME" />
            <button class="btn action-btn" type="submit">Salvar</button>
          </form>
        </div>
      </div>
    </main>
    <script type="module" src="./js/filmes.js"></script>
  </body>
</html>
